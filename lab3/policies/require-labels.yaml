apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-labels
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - cnpg-system
          - resources:
              names:
                - shop-postgres-*
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: grafana
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: loki
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: jaeger
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: karma
      validate:
        message: "Обязательные метки"
        pattern:
            metadata:
              labels:
                app: "?*"