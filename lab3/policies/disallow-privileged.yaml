apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-privileged
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Запрет privileged"
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.containers[?securityContext.privileged == `true`] | length(@) }}"
                operator: GreaterThan
                value: 0