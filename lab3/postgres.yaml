apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-postgres
  labels:
    app: shop-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-postgres
  template:
    metadata:
      labels:
        app: shop-postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: shop
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: shop-postgres
  labels:
    app: shop-postgres
spec:
  selector:
    app: shop-postgres
  ports:
    - port: 5432
      targetPort: 5432