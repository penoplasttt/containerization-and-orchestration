api:
  image:
    repository: docker.io/library/shop-api
    tag: v6
    pullPolicy: IfNotPresent
  replicas: 5
  port: 8080
  env:
    DATABASE_URL: "postgres://postgres:postgres@shop-postgres:5432/shop?sslmode=disable"
    HEALTH_FAIL: "true" 

worker:
  image:
    repository: docker.io/library/shop-worker
    tag: v1
    pullPolicy: IfNotPresent
  replicas: 2
  env:
    DATABASE_URL: "postgres://postgres:postgres@shop-postgres:5432/shop?sslmode=disable"
