apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shop-postgres
spec:
  instances: 1
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: shop-app-secret
  storage:
    size: 1Gi
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}