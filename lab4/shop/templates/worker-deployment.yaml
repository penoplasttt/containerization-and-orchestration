apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-worker
  labels:
    app: shop-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: shop-worker
  template:
    metadata:
      labels:
        app: shop-worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              value: {{ .Values.worker.env.DATABASE_URL | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
