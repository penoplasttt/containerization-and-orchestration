apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - cnpg-system
                - argocd
          - resources:
              names:
                - shop-postgres-*
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: grafana
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: loki
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: jaeger
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: karma
      validate:
        message: "Образ не должен использовать тег latest"
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.containers[?ends_with(image, ':latest')] | length(@) }}"
                operator: GreaterThan
                value: 0