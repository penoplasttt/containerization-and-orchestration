apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resources
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-resources
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - cnpg-system
                - argocd
                - monitoring
          - resources:
              names:
                - shop-postgres-*
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: grafana
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: loki
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: jaeger
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: karma
      validate:
        message: "Каждый контейнер должен указывать requests по cpu и memory, и limits по memory"
        pattern:              
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"