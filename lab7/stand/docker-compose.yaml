services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.45.5}
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_METRICS=true
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true
      - N8N_METRICS_INCLUDE_MESSAGE_METRICS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      - N8N_METRICS_INCLUDE_NODE_TYPE_LABEL=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/output
    volumes:
      - n8n_data:/home/node/.n8n
      - ../output:/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lab7-net

  mcp-fs:
    image: supercorp/supergateway:${SUPERGATEWAY_VERSION:-4.2.1}
    container_name: mcp-fs
    restart: unless-stopped
    command:
      - --stdio
      - "npx -y @modelcontextprotocol/server-filesystem /data"
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
    volumes:
      - ../knowledge-base:/data
    networks:
      - lab7-net

  mcp-gitlab:
    image: zereight050/gitlab-mcp:latest
    container_name: mcp-gitlab
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - GITLAB_PERSONAL_ACCESS_TOKEN=${GITLAB_MCP_TOKEN}
      - GITLAB_API_URL=${GITLAB_URL:-https://gitlab.com}/api/v4
      - GITLAB_PERMISSION_MODE=readonly
      - GITLAB_TOOLSETS=core
      - STREAMABLE_HTTP=true
      - STREAMABLE_HTTP_AUTH_TOKEN=${GITLAB_MCP_TOKEN}
      - MCP_ALLOWED_HOSTS=mcp-gitlab:3002
    networks:
      - lab7-net

  mcp-prometheus:
    image: supercorp/supergateway:${SUPERGATEWAY_VERSION:-4.2.1}
    container_name: mcp-prometheus
    restart: unless-stopped
    command:
      - --stdio
      - "npx -y prometheus-mcp-server"
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
    environment:
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
    depends_on:
      - prometheus
    networks:
      - lab7-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - lab7-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/n8n-monitoring.json:ro
    depends_on:
      - prometheus
    networks:
      - lab7-net

volumes:
  n8n_data:
  grafana_data:

networks:
  lab7-net:
    name: lab7-net