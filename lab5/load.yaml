apiVersion: v1
kind: Pod
metadata:
  name: load-gen
  namespace: shop
  labels:
    app: load-gen
    net.allow-dns: "true"
spec:
  containers:
    - name: load
      image: docker.io/library/busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Начинаю нагрузку на http://shop-api/orders (по DNS-имени)"
          ok=0; fail=0
          while true; do
            if wget -q -O /dev/null http://shop-api/orders; then
              ok=$((ok+1))
            else
              fail=$((fail+1))
              echo "FAIL at $(date +%H:%M:%S) (ok=$ok fail=$fail)"
            fi
            sleep 0.2
          done
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
  restartPolicy: Never