apiVersion: v1
kind: Pod
metadata:
  name: stranger
  namespace: shop
  labels:
    app: stranger
spec:
  containers:
    - name: stranger
      image: docker.io/library/busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
  restartPolicy: Never