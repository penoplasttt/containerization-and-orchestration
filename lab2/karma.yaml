apiVersion: apps/v1
kind: Deployment
metadata:
  name: karma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karma
  template:
    metadata:
      labels:
        app: karma
    spec:
      containers:
        - name: karma
          image: ghcr.io/prymitive/karma:latest
          ports:
            - containerPort: 8080
          env:
            - name: ALERTMANAGER_URI
              value: "http://prometheus-alertmanager.default.svc.cluster.local:9093"
---
apiVersion: v1
kind: Service
metadata:
  name: karma
spec:
  selector:
    app: karma
  ports:
    - port: 8081
      targetPort: 8080